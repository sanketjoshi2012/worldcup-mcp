<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 AI Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #e6e6e6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1a1f3a;
    border-bottom: 2px solid #f0c040;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  header .logo {
    font-size: 28px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #f0c040;
    letter-spacing: 0.5px;
  }

  header p {
    font-size: 12px;
    color: #8892b0;
    margin-top: 2px;
  }

  .suggestions {
    background: #161b2e;
    padding: 12px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid #2a2f4a;
  }

  .suggestion-btn {
    background: #1a1f3a;
    border: 1px solid #2e3560;
    color: #a0a8c8;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .suggestion-btn:hover {
    border-color: #f0c040;
    color: #f0c040;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 780px;
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .msg.user .avatar { background: #f0c040; }
  .msg.bot .avatar { background: #1a1f3a; border: 1px solid #f0c040; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.6;
    max-width: 640px;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: #1a1f3a;
    border: 1px solid #2e3560;
    border-top-right-radius: 4px;
    color: #e6e6e6;
  }

  .msg.bot .bubble {
    background: #161b2e;
    border: 1px solid #2a2f4a;
    border-top-left-radius: 4px;
  }

  .tool-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #f0c040;
    font-size: 13px;
    padding: 6px 0;
    animation: pulse 1.5s infinite;
  }

  .tool-indicator .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f0c040;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .input-area {
    background: #1a1f3a;
    border-top: 1px solid #2a2f4a;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  #input {
    flex: 1;
    background: #0d1117;
    border: 1px solid #2e3560;
    border-radius: 12px;
    padding: 12px 16px;
    color: #e6e6e6;
    font-size: 15px;
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #input:focus { border-color: #f0c040; }
  #input::placeholder { color: #4a5080; }

  #send {
    background: #f0c040;
    color: #0d1117;
    border: none;
    border-radius: 12px;
    width: 48px;
    height: 48px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  #send:hover { background: #ffd700; }
  #send:disabled { background: #2e3560; cursor: not-allowed; }

  .welcome {
    text-align: center;
    margin: auto;
    padding: 40px;
  }

  .welcome .trophy { font-size: 64px; margin-bottom: 16px; }
  .welcome h2 { color: #f0c040; font-size: 22px; margin-bottom: 8px; }
  .welcome p { color: #8892b0; font-size: 15px; }
</style>
</head>
<body>

<header>
  <div class="logo">⚽</div>
  <div>
    <h1>FIFA World Cup 2026 AI Assistant</h1>
    <p>Powered by Claude + MCP</p>
  </div>
</header>

<div class="suggestions">
  <button class="suggestion-btn" onclick="send('What matches are today?')">Today's matches</button>
  <button class="suggestion-btn" onclick="send('Show me the group standings')">Group standings</button>
  <button class="suggestion-btn" onclick="send('Show me all quarterfinal results')">Quarterfinal results</button>
  <button class="suggestion-btn" onclick="send('Who scored the most goals so far?')">Top scorers</button>
</div>

<div id="chat">
  <div class="welcome">
    <div class="trophy">🏆</div>
    <h2>Welcome to the World Cup 2026 Assistant</h2>
    <p>Ask me about today's matches, results, standings, or any team!</p>
  </div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="Ask about matches, scores, standings..." rows="1"></textarea>
  <button id="send" onclick="sendMessage()">➤</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${protocol}://${location.host}/chat`);
  let toolEl = null;

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'tool') {
      if (!toolEl) {
        toolEl = document.createElement('div');
        toolEl.className = 'tool-indicator';
        toolEl.innerHTML = `<div class="dot"></div> Fetching ${data.name.replace(/_/g, ' ')}...`;
        chat.appendChild(toolEl);
      } else {
        toolEl.innerHTML = `<div class="dot"></div> Fetching ${data.name.replace(/_/g, ' ')}...`;
      }
      chat.scrollTop = chat.scrollHeight;
    } else {
      if (toolEl) { toolEl.remove(); toolEl = null; }
      addMessage('bot', data.content);
      sendBtn.disabled = false;
    }
  };

  function addMessage(role, text) {
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    msg.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '⚽'}</div>
      <div class="bubble">${text}</div>
    `;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function send(text) {
    input.value = text;
    sendMessage();
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    addMessage('user', text);
    ws.send(text);
    input.value = '';
    sendBtn.disabled = true;
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
